<!DOCTYPE html>

<html>

<head>

    <title>Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <h1>JobMatch</h1>

</header>


<div class="form-container">

    <h2>Login</h2>

    <input
        type="email"
        id="email"
        placeholder="Email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button onclick="login()">
        Login
    </button>

    <p id="message"></p>

    <p>
        Don't have an account?
        <a href="register.html">
            Register
        </a>
    </p>

</div>


<script src="script.js"></script>

</body>

</html>
