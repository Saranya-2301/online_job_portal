<!DOCTYPE html>

<html>

<head>

    <title>Register</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <h1>JobMatch</h1>

</header>


<div class="form-container">

    <h2>Create Account</h2>

    <input
        type="text"
        id="name"
        placeholder="Name"
    >

    <input
        type="email"
        id="email"
        placeholder="Email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <select id="role">

        <option value="candidate">
            Candidate
        </option>

        <option value="recruiter">
            Recruiter
        </option>

    </select>

    <button onclick="register()">
        Register
    </button>

    <p id="message"></p>

</div>


<script src="script.js"></script>

</body>

</html>
